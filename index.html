<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d14">
  <title>Информатика — интерактивный учебник</title>

  <style>
    :root {
      --bg: #0b0d14;
      --bg-card: #131722;
      --bg-card-hover: #1a2030;
      --bg-soft: #10141f;
      --text: #f4f7fb;
      --muted: #9aa5b5;
      --border: #293246;
      --blue: #4dabf7;
      --purple: #9775fa;
      --green: #51cf66;
      --yellow: #ffd43b;
      --red: #ff6b6b;
      --gradient: linear-gradient(135deg, #4dabf7, #9775fa);
      --shadow: 0 18px 60px rgba(0, 0, 0, .28);
      --radius: 18px;
      --max-width: 1120px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, rgba(77, 171, 247, .1), transparent 30rem),
        radial-gradient(circle at 85% 20%, rgba(151, 117, 250, .1), transparent 30rem),
        var(--bg);
      font-family: Inter, Arial, sans-serif;
      line-height: 1.6;
    }

    body.light {
      --bg: #f4f7fb;
      --bg-card: #ffffff;
      --bg-card-hover: #eef4ff;
      --bg-soft: #edf2f8;
      --text: #172033;
      --muted: #647084;
      --border: #d9e1ee;
      --shadow: 0 18px 60px rgba(36, 62, 95, .12);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    .container {
      width: min(var(--max-width), calc(100% - 36px));
      margin: 0 auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 13, 20, .86);
      backdrop-filter: blur(16px);
    }

    body.light .site-header {
      background: rgba(244, 247, 251, .86);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 72px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      font-size: 1.08rem;
      font-weight: 800;
      text-decoration: none;
    }

    .logo-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 12px;
      background: var(--gradient);
      color: white;
      font-size: 1.2rem;
      box-shadow: 0 8px 25px rgba(77, 171, 247, .25);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button,
    .header-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: var(--bg-card);
      transition: .2s ease;
    }

    .icon-button:hover,
    .header-back:hover {
      border-color: var(--blue);
      transform: translateY(-2px);
    }

    .header-back {
      padding: 0 14px;
      gap: 7px;
      font-size: .9rem;
    }

    .reading-bar {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 30;
      width: 0;
      height: 3px;
      background: var(--gradient);
      transition: width .15s linear;
    }

    main {
      min-height: calc(100vh - 150px);
    }

    .page {
      padding: 72px 0 90px;
      animation: page-in .4s ease both;
    }

    .page.leaving {
      animation: page-out .25s ease both;
    }

    @keyframes page-in {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes page-out {
      to {
        opacity: 0;
        transform: translateY(18px);
      }
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 64px 0 72px;
      text-align: center;
    }

    .hero h1 {
      max-width: 850px;
            margin: 0 auto 20px;
      font-size: clamp(2.2rem, 7vw, 5rem);
      line-height: 1.05;
      letter-spacing: -.05em;
    }

    .hero h1 span {
      color: var(--blue);
    }

    .hero p {
      max-width: 680px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 0 0 24px;
    }

    .section-heading h2,
    .game-header h2 {
      margin: 0;
      font-size: clamp(1.55rem, 4vw, 2.25rem);
      line-height: 1.15;
    }

    .section-heading p {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .paragraph-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .paragraph-card {
      position: relative;
      min-height: 250px;
      padding: 25px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      box-shadow: var(--shadow);
      transition: .25s ease;
    }

    .paragraph-card:hover {
      border-color: var(--blue);
      background: var(--bg-card-hover);
      transform: translateY(-5px);
    }

    .paragraph-card.locked {
      opacity: .58;
      filter: grayscale(.5);
    }

    .paragraph-card.completed {
      border-color: rgba(81, 207, 102, .55);
    }

    .card-icon {
      display: grid;
      width: 52px;
      height: 52px;
      margin-bottom: 22px;
      place-items: center;
      border-radius: 15px;
      background: rgba(77, 171, 247, .12);
      font-size: 1.65rem;
    }

    .paragraph-card h3 {
      margin: 0 0 10px;
      font-size: 1.22rem;
      line-height: 1.25;
    }

    .paragraph-card p {
      min-height: 53px;
      margin: 0 0 22px;
      color: var(--muted);
      font-size: .94rem;
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .status {
      color: var(--muted);
      font-size: .8rem;
    }

    .status.done {
      color: var(--green);
    }

    .primary-button,
    .secondary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 17px;
      border-radius: 11px;
      font-weight: 700;
      transition: .2s ease;
    }

    .primary-button {
      border: 0;
      color: white;
      background: var(--gradient);
      box-shadow: 0 9px 25px rgba(77, 171, 247, .2);
    }

    .primary-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .secondary-button {
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--bg-card);
    }

    .secondary-button:hover {
      border-color: var(--blue);
      transform: translateY(-2px);
    }

    .progress-section {
      margin: 48px 0 0;
      padding: 23px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: .9rem;
    }

    .progress-track,
    .result-track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--border);
    }

    .progress-fill,
    .result-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--gradient);
      transition: width .7s ease;
    }

    .article-head {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 24px;
      align-items: start;
      margin-bottom: 38px;
    }

    .article-icon {
      display: grid;
      width: 100px;
      height: 100px;
      place-items: center;
            border: 1px solid var(--border);
      border-radius: 25px;
      background: var(--bg-card);
      font-size: 3.5rem;
      box-shadow: var(--shadow);
    }

    .article-head h1 {
      max-width: 850px;
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.8rem);
      line-height: 1.05;
      letter-spacing: -.045em;
    }

    .article-head p {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .article-content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 28px;
      align-items: start;
    }

    .content-column {
      min-width: 0;
    }

    .topic {
      margin-bottom: 22px;
      padding: 25px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
    }

    .topic h2 {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 0 0 13px;
      font-size: 1.35rem;
    }

    .topic p {
      margin: 0;
      color: var(--muted);
    }

    .sidebar {
      position: sticky;
      top: 95px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
    }

    .sidebar h3 {
      margin: 0 0 14px;
    }

    .term {
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }

    .term:last-child {
      border-bottom: 0;
    }

    .term strong {
      display: block;
      margin-bottom: 3px;
      color: var(--blue);
      font-size: .92rem;
    }

    .term span {
      display: block;
      color: var(--muted);
      font-size: .83rem;
      line-height: 1.45;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin: 24px 0;
    }

    .media-card {
      min-height: 145px;
      padding: 19px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background:
        linear-gradient(135deg, rgba(77, 171, 247, .15), rgba(151, 117, 250, .13)),
        var(--bg-card);
    }

    .media-card .media-icon {
      margin-bottom: 18px;
      font-size: 2rem;
    }

    .media-card p {
      margin: 0;
      color: var(--muted);
      font-size: .85rem;
    }

    .game-panel {
      margin: 40px 0;
      padding: 28px;
      border: 1px solid rgba(77, 171, 247, .4);
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, rgba(77, 171, 247, .08), rgba(151, 117, 250, .08)),
        var(--bg-card);
      box-shadow: var(--shadow);
    }

    .game-header,
    .binary-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 20px;
    }

    .score {
      color: var(--muted);
      font-family: monospace;
      font-size: .85rem;
      text-align: right;
    }

    .quiz-meta {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin: 24px 0 10px;
      color: var(--muted);
      font-family: monospace;
      font-size: .85rem;
    }

    .quiz-progress {
      height: 8px;
      overflow: hidden;
      margin-bottom: 22px;
      border-radius: 99px;
      background: var(--border);
    }

    .quiz-progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--gradient);
      transition: width .35s ease;
    }

    .question {
      margin: 0 0 20px;
      font-size: 1.17rem;
      font-weight: 700;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      background: var(--bg-soft);
      text-align: left;
      transition: .2s ease;
    }

    .answer:hover:not(:disabled) {
      border-color: var(--blue);
      background: var(--bg-card-hover);
      transform: translateX(4px);
    }

    .answer:disabled {
      cursor: default;
    }

    .answer.correct {
      border-color: var(--green);
      background: rgba(81, 207, 102, .16);
    }
  
    .answer.wrong {
      border-color: var(--red);
      background: rgba(255, 107, 107, .16);
    }

    .feedback {
      min-height: 28px;
      margin: 14px 0 0;
      font-weight: 700;
    }

    .feedback.correct {
      color: var(--green);
    }

    .feedback.wrong {
      color: var(--red);
    }

    .result {
      padding: 20px 0 4px;
      text-align: center;
    }

    .result-score {
      margin: 10px 0;
      color: var(--blue);
      font-family: monospace;
      font-size: clamp(3.5rem, 12vw, 6rem);
      font-weight: 800;
      line-height: 1;
    }

    .result-track {
      max-width: 500px;
      margin: 20px auto;
    }

    .result-fill {
      width: 0;
    }

    .binary-timer {
      min-width: 75px;
      color: var(--green);
      font-family: monospace;
      font-size: 1.15rem;
      font-weight: 800;
      text-align: right;
    }

    .binary-timer.warning {
      color: var(--red);
      animation: pulse .7s infinite alternate;
    }

    @keyframes pulse {
      to {
        transform: scale(1.1);
      }
    }

    .binary-task {
      margin-top: 25px;
      padding: 28px 18px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--bg-soft);
      text-align: center;
    }

    .binary-task p {
      margin: 0;
      color: var(--muted);
    }

    .binary-expression {
      margin: 13px 0 23px;
      color: var(--blue);
      font-family: monospace;
      font-size: clamp(2rem, 9vw, 4rem);
      font-weight: 800;
      line-height: 1;
    }

    .binary-form {
      display: flex;
      max-width: 580px;
      margin: 0 auto;
      gap: 10px;
    }

    .binary-input {
      min-width: 0;
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 0 14px;
      outline: 0;
      color: var(--text);
      background: var(--bg-card);
      font-family: monospace;
      font-size: 1rem;
    }

    .binary-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(77, 171, 247, .15);
    }

    .binary-feedback {
      min-height: 27px;
      margin-top: 16px;
      font-weight: 700;
    }

    .binary-feedback.correct {
      color: var(--green);
    }

    .binary-feedback.wrong {
      color: var(--red);
    }

    .binary-explanation {
      min-height: 24px;
      color: var(--muted);
      font-family: monospace;
      font-size: .86rem;
    }

    .article-footer {
      margin-top: 34px;
      text-align: center;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 40;
      max-width: min(360px, calc(100% - 40px));
      padding: 13px 17px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: var(--bg-card);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      transition: .3s ease;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .back-to-top {
      position: fixed;
      right: 20px;
      bottom: 78px;
      z-index: 25;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--text);
      background: var(--bg-card);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: .3s ease;
    }

    .back-to-top.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .plus-one {
      position: fixed;
      z-index: 50;
      color: var(--green);
      font-family: monospace;
      font-size: 1.4rem;
      font-weight: 800;
      pointer-events: none;
      animation: plus-up .9s ease forwards;
    }

    @keyframes plus-up {
      from {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      to {
        opacity: 0;
        transform: translateY(-70px) scale(1.2);
      }
    }

    .confetti {
      position: fixed;
      z-index: 49;
      width: 8px;
            height: 13px;
      pointer-events: none;
      animation: confetti-fall .9s ease-out forwards;
    }

    @keyframes confetti-fall {
      from {
        opacity: 1;
        transform: translate(0, 0) rotate(0);
      }

      to {
        opacity: 0;
        transform: translate(var(--x), var(--y)) rotate(540deg);
      }
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 28px 0;
      color: var(--muted);
      font-size: .86rem;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .footer-links {
      display: flex;
      gap: 16px;
    }

    .footer-links a {
      color: var(--blue);
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .cursor-glow {
      position: fixed;
      z-index: -1;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(77, 171, 247, .1), transparent 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 800px) {
      .paragraph-grid,
      .article-content {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }

      .media-grid {
        grid-template-columns: 1fr;
      }

      .article-head {
        grid-template-columns: 70px 1fr;
      }

      .article-icon {
        width: 70px;
        height: 70px;
        border-radius: 18px;
        font-size: 2.3rem;
      }
    }

    @media (max-width: 560px) {
      .container {
        width: min(100% - 24px, var(--max-width));
      }

      .page {
        padding-top: 42px;
      }

      .header-inner {
        min-height: 62px;
      }

      .logo-text {
        display: none;
      }

      .hero {
        padding: 42px 0 52px;
      }

      .paragraph-grid {
        grid-template-columns: 1fr;
      }

      .section-heading,
      .game-header,
      .binary-header,
      .footer-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .score {
        text-align: left;
      }

      .article-head {
        gap: 14px;
      }

      .article-head h1 {
        font-size: 1.9rem;
      }

      .topic,
      .game-panel {
        padding: 20px;
      }

      .binary-form {
        flex-direction: column;
      }

      .binary-input {
        min-height: 45px;
      }

      .binary-form button {
        width: 100%;
      }

      .footer-links {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>
  <div class="reading-bar" id="readingBar"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="#/">
        <span class="logo-mark">⌘</span>
        <span class="logo-text">Информатика</span>
      </a>

      <div class="header-actions">
        <button
          class="header-back"
          id="backButton"
          type="button"
          hidden
        >
          ← Назад
        </button>

        <button
          class="icon-button"
          id="themeButton"
          type="button"
          aria-label="Переключить тему"
          title="Переключить тему"
        >
          ☾
        </button>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <footer>
    <div class="container footer-inner">
      <div>
        Сделано для изучения информатики ·
        <span id="year"></span>
      </div>

      <nav class="footer-links" aria-label="Навигация">
        <a href="#/">Параграфы</a>
        <a href="#/paragraph/1">WWW</a>
        <a href="#/paragraph/2">Двоичная система</a>
      </nav>
    </div>
  </footer>

  <button
    class="back-to-top"
    id="backToTop"
    type="button"
    aria-label="Прокрутить наверх"
  >
    ↑
  </button>

  <div class="toast" id="toast"></div>
    <script>
    "use strict";

    const STORAGE_KEY = "informatics-single-file-state";
    const STORAGE_VERSION = 2;

    const defaultState = {
      version: STORAGE_VERSION,
      theme: "dark",
      studied: [],
      scrollPositions: {},
      games: {
        quiz: {
          best: 0,
          attempts: 0
        },
        binary: {
          best: 0,
          attempts: 0
        }
      }
    };

    const paragraphs = [
      {
        id: 1,

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function migrateState(oldState) {
      const migrated = {
        ...clone(defaultState),
        ...oldState,
        games: {
          ...clone(defaultState.games),
          ...(oldState.games || {}),
          quiz: {
            ...clone(defaultState.games.quiz),
            ...((oldState.games || {}).quiz || {})
          },
          binary: {
            ...clone(defaultState.games.binary),
            ...((oldState.games || {}).binary || {})
          }
        }
      };

      migrated.version = STORAGE_VERSION;

      if (typeof oldState.quizScore === "number") {
        migrated.games.quiz.best = Math.max(
          migrated.games.quiz.best,
          oldState.quizScore
        );

        delete migrated.quizScore;
      }

      if (!Array.isArray(migrated.studied)) {
        migrated.studied = [];
      }

      if (!migrated.scrollPositions || typeof migrated.scrollPositions !== "object") {
        migrated.scrollPositions = {};
      }

      return migrated;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);

        if (!raw) {
          return clone(defaultState);
        }

        return migrateState(JSON.parse(raw));
      } catch {
        return clone(defaultState);
      }
    }

    function saveState(message = "") {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

      if (message) {        showToast(message);
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showToast(message) {
      clearTimeout(toastTimer);

      toast.textContent = message;
      toast.classList.add("visible");

      toastTimer = setTimeout(() => {
        toast.classList.remove("visible");
      }, 2500);
    }

    function initQuiz(item) {
      const questions = item.game.questions;
            const content = document.getElementById("quizContent");
      const counter = document.getElementById("quizCounter");
      const scoreElement = document.getElementById("quizScore");
      const progress = document.getElementById("quizProgress");

      let current = 0;
      let score = 0;

      function updateHeader() {
        counter.textContent =
          `Вопрос ${Math.min(current + 1, questions.length)} из ${questions.length}`;

        scoreElement.textContent = `Счёт: ${score}`;
        progress.style.width = `${(current / questions.length) * 100}%`;
      }

      function drawQuestion() {
        const question = questions[current];

        if (!question) {
          finishQuiz();
          return;
        }

        updateHeader();

        content.innerHTML = `
          <p class="question">
            ${current + 1}. ${escapeHtml(question.question)}
          </p>

          <div class="answers">
            ${question.answers.map((answer, index) => `
              <button
                class="answer"
                type="button"
                data-answer="${index}"
              >
                ${escapeHtml(answer)}
              </button>
            `).join("")}
          </div>

          <div class="feedback" id="quizFeedback"></div>
        `;

        content.querySelectorAll("[data-answer]").forEach(button => {
          button.addEventListener("click", () => {
            checkAnswer(button, question);
          });
        });
      }

      function checkAnswer(button, question) {
        const selected = Number(button.dataset.answer);
        const feedback = document.getElementById("quizFeedback");
        const buttons = content.querySelectorAll("[data-answer]");

        buttons.forEach(item => {
          item.disabled = true;
        });

        if (selected === question.correct) {
          score += 1;
          button.classList.add("correct");
          button.textContent = `✓ ${button.textContent}`;
          feedback.textContent = "✓ Правильно!";
          feedback.className = "feedback correct";

          showToast("Отличная работа!");
          showPlusOne(button);
          createConfetti();
        } else {
          button.classList.add("wrong");
          button.textContent = `✗ ${button.textContent}`;

          const correctButton = content.querySelector(
            `[data-answer="${question.correct}"]`
          );

          correctButton.classList.add("correct");
          correctButton.textContent = `✓ ${correctButton.textContent}`;

          feedback.textContent =
            "✗ Неверно. Правильный ответ отмечен зелёным.";
          feedback.className = "feedback wrong";
        }

        scoreElement.textContent = `Счёт: ${score}`;
        progress.style.width = `${((current + 1) / questions.length) * 100}%`;

        setTimeout(() => {
          current += 1;
          drawQuestion();
        }, 950);
      }

      function finishQuiz() {
        const percent = Math.round((score / questions.length) * 100);

        state.games.quiz.attempts += 1;
        state.games.quiz.best = Math.max(state.games.quiz.best, score);
        saveState("Результат квиза сохранён");

        counter.textContent = "Тест завершён";
        progress.style.width = "100%";

        content.innerHTML = `
          <div class="result">
            <p class="eyebrow">Отличная работа!</p>

            <div class="result-score">${score}/${questions.length}</div>

            <p>Правильных ответов: <strong>${percent}%</strong></p>

            <div class="result-track">
              <div class="result-fill" id="quizResultFill"></div>
            </div>

            <p>
              Лучший результат:
              <strong>${state.games.quiz.best}/${questions.length}</strong>
            </p>

            <button class="primary-button" id="restartQuiz" type="button">
              Пройти заново
            </button>
          </div>
        `;

        requestAnimationFrame(() => {          document.getElementById("quizResultFill").style.width = `${percent}%`;
        });

        document.getElementById("restartQuiz").addEventListener("click", () => {
          current = 0;
          score = 0;
          drawQuestion();
        });
      }

      drawQuestion();
    }

    function initBinary() {
      const content = document.getElementById("binaryContent");
      const timerElement = document.getElementById("binaryTimer");

      const totalRounds = 5;
      const totalSeconds = 60;

      let round = 0;
      let score = 0;
      let secondsLeft = totalSeconds;
      let currentTask = null;
      let startTime = 0;
      let totalAnswerTime = 0;
      let locked = false;

      clearInterval(binaryTimer);
      updateTimer();
      startTimer();
      drawRound();

      function createTask() {
        const direction = Math.random() < .5
          ? "binary-to-decimal"
          : "decimal-to-binary";

        const value = Math.floor(Math.random() * 256);

        if (direction === "binary-to-decimal") {
          return {
            direction,
            value,
            prompt: `${value.toString(2).padStart(8, "0")}₂`,
            answer: String(value),
            label: "Переведите двоичное число в десятичное."
          };
        }

        return {
          direction,
          value,
          prompt: `${value}₁₀`,
          answer: value.toString(2).padStart(8, "0"),
          label: "Переведите десятичное число в двоичное."
        };
      }

      function updateTimer() {
        const seconds = String(Math.max(secondsLeft, 0)).padStart(2, "0");

        timerElement.textContent = `00:${seconds}`;
        timerElement.classList.toggle("warning", secondsLeft <= 10);
      }

      function startTimer() {
        clearInterval(binaryTimer);

        binaryTimer = setInterval(() => {
          secondsLeft -= 1;
          updateTimer();

          if (secondsLeft <= 0) {
            finish(true);
          }
        }, 1000);
      }

      function drawRound() {
        if (round >= totalRounds) {
          finish(false);
          return;
        }

        currentTask = createTask();
        startTime = performance.now();
        locked = false;

        content.innerHTML = `
          <div class="quiz-meta">
            <span>Раунд ${round + 1} из ${totalRounds}</span>
            <span>Счёт: ${score}</span>
          </div>

          <div class="binary-task">
            <p>${currentTask.label}</p>

            <div class="binary-expression">
              ${currentTask.prompt}
            </div>

            <form class="binary-form" id="binaryForm">
              <label class="sr-only" for="binaryAnswer">
                Ответ
              </label>

              <input
                class="binary-input"
                id="binaryAnswer"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                placeholder="Введите ответ"
                required
              >

              <button class="primary-button" type="submit">
                Проверить
              </button>
            </form>

            <div class="binary-feedback" id="binaryFeedback"></div>
            <div class="binary-explanation" id="binaryExplanation"></div>
          </div>
        `;

        const form = document.getElementById("binaryForm");
        const input = document.getElementById("binaryAnswer");

        input.focus();

        form.addEventListener("submit", event => {
          event.preventDefault();

          if (!locked) {
            checkAnswer(input.value.trim());
          }
        });
      }

      function checkAnswer(value) {
        const input = document.getElementById("binaryAnswer");
        const feedback = document.getElementById("binaryFeedback");
        const explanation = document.getElementById("binaryExplanation");

        locked = true;
        input.disabled = true;

        totalAnswerTime += (performance.now() - startTime) / 1000;

        let normalized = value;
                if (currentTask.direction === "binary-to-decimal") {
          normalized = String(Number(value));
        } else {
          normalized = value.replace(/^0+(?=\d)/, "");
        }

        if (normalized === currentTask.answer) {
          score += 1;

          feedback.textContent = "✓ Верно!";
          feedback.className = "binary-feedback correct";

          showPlusOne(input);
          createConfetti();

          setTimeout(() => {
            round += 1;
            drawRound();
          }, 850);
        } else {
          feedback.textContent =
            `✗ Неверно. Правильный ответ: ${currentTask.answer}`;

          feedback.className = "binary-feedback wrong";
          explanation.textContent = makeExplanation(currentTask.value);

          setTimeout(() => {
            round += 1;
            drawRound();
          }, 1700);
        }
      }

      function makeExplanation(value) {
        const powers = [128, 64, 32, 16, 8, 4, 2, 1];
        const parts = powers.filter(power => value & power);

        return `${value} = ${parts.join(" + ")} → ${value.toString(2).padStart(8, "0")}₂`;
      }

      function finish(timeout) {
        if (locked && round >= totalRounds) {
          return;
        }

        clearInterval(binaryTimer);
        locked = true;

        const completedRounds = Math.max(1, Math.min(round + 1, totalRounds));
        const averageTime =
          (totalAnswerTime / completedRounds).toFixed(1);

        state.games.binary.attempts += 1;
        state.games.binary.best = Math.max(state.games.binary.best, score);
        saveState("Результат тренажёра сохранён");

        content.innerHTML = `
          <div class="result">
            <p class="eyebrow">
              ${timeout ? "Время вышло" : "Тренажёр завершён"}
            </p>

            <div class="result-score">${score}/${totalRounds}</div>

            <p>
              Среднее время ответа:
              <strong>${averageTime} с</strong>
            </p>

            <p>
              Лучший результат:
              <strong>${state.games.binary.best}/${totalRounds}</strong>
            </p>

            <button class="primary-button" id="restartBinary" type="button">
              Ещё раз
            </button>
          </div>
        `;

        document.getElementById("restartBinary").addEventListener("click", () => {
          initBinary();
        });
      }
    }

    function showPlusOne(element) {
      const rect = element.getBoundingClientRect();
      const plus = document.createElement("div");

      plus.className = "plus-one";
      plus.textContent = "+1";
      plus.style.left = `${rect.left + rect.width / 2}px`;
      plus.style.top = `${rect.top}px`;

      document.body.appendChild(plus);

      plus.addEventListener("animationend", () => {
        plus.remove();
      });
    }

    function createConfetti() {
      const colors = [
        "#4dabf7",
        "#9775fa",
        "#51cf66",
        "#ffd43b",
        "#ff6b6b"
      ];

      for (let index = 0; index < 25; index += 1) {
        const particle = document.createElement("div");

        particle.className = "confetti";
        particle.style.left = `${window.innerWidth / 2}px`;
        particle.style.top = `${window.innerHeight / 2}px`;
        particle.style.background = colors[index % colors.length];
        particle.style.setProperty("--x", `${Math.random() * 360 - 180}px`);
        particle.style.setProperty("--y", `${Math.random() * 300 + 80}px`);

        document.body.appendChild(particle);

        particle.addEventListener("animationend", () => {
          particle.remove();
        });
      }
    }

    function initCursorGlow() {
      const glow = document.getElementById("cursorGlow");

      if (!glow || window.matchMedia("(pointer: coarse)").matches) {
        return;
      }

      window.addEventListener("pointermove", event => {
        glow.style.left = `${event.clientX}px`;
        glow.style.top = `${event.clientY}px`;
      }, { passive: true });
    }
      function updateReadingProgress() {
      const documentHeight =
        document.documentElement.scrollHeight - window.innerHeight;

      const progress = documentHeight > 0
        ? window.scrollY / documentHeight * 100
        : 0;

      readingBar.style.width = `${progress}%`;
      backToTop.classList.toggle("visible", window.scrollY > 400);
    }

    function route() {
      const path = location.hash.replace(/^#\/?/, "");

      if (path.startsWith("paragraph/")) {
        const id = Number(path.split("/")[1]);
        const item = getParagraph(id);

        if (item && item.available) {
          renderArticle(item);
          return;
        }
      }

      clearInterval(binaryTimer);
      renderHome();
    }

    themeButton.addEventListener("click", () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      updateTheme();
      saveState();
    });

    backButton.addEventListener("click", () => {
      location.hash = "#/";
    });

    backToTop.addEventListener("click", () => {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });

    window.addEventListener("scroll", updateReadingProgress, {
      passive: true
    });

    window.addEventListener("hashchange", route);

    document.getElementById("year").textContent = new Date().getFullYear();

    updateTheme();
    route();
    updateReadingProgress();
  </script>
</body>
</html>
